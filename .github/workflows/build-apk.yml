name: Build APK

# 版本规则（见 AGENTS.md「版本号规则（全软件统一）」）：
#   package.json 的 version 只维护三位正式版本 A.B.C；
#   push main / 手动触发 = 测试构建：产物版本 A.B.C.<run_number>，只出 artifact，不建 tag、不建 Release；
#   推送 vA.B.C 标签 = 正式发布：产物版本 A.B.C，创建 GitHub Release 并上传 APK。

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    # 创建 GitHub Release 需要 contents: write（仓库默认只读时会失败）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 不再依赖 android-actions/setup-android：v3 与 v4 都会在「镜像里预装的 cmdline-tools 版本
      # 不等于它写死的版本」时去下载一个固定构建号的 commandline-tools 包，Google 清理旧包后该下载
      # 一律 404 —— 主 App 的 run 35035978640（v3）与 35054440736（v4）都断在 Setup Android SDK，
      # 12 秒内失败，连 npm ci 都没跑到；上游 issue android-actions/setup-android#536 报的是同一个坑。
      # 本仓库 CI 与主 App 同源，故同样改为直接用 runner 镜像自带的 Android SDK 与 sdkmanager：
      # 这里只做定位与许可确认，缺的平台 / 构建工具按 sdkmanager 的当前仓库清单补装，不再有写死地址。
      - name: Use preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKM" ]; then echo "runner 镜像里找不到 sdkmanager，镜像可能又变了" >&2; exit 1; fi
          echo "sdkmanager: $SDKM"
          "$SDKM" --version
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          INST="$("$SDKM" --list_installed 2>/dev/null || true)"
          for pkg in "platform-tools" "build-tools;35.0.0" "build-tools;34.0.0" "platforms;android-35" "platforms;android-34"; do
            echo "$INST" | grep -q -- "$pkg" || { echo "补装 $pkg"; "$SDKM" "$pkg" >/dev/null; }
          done
          "$SDKM" --list_installed 2>/dev/null | sed -n '1,40p' || true

      - name: Install dependencies
        run: npm ci

      # package.json 里的 postinstall 已会执行；此处显式再跑一次，
      # 让补丁输出在构建日志里单独可见，便于排查 assembleRelease 失败。
      - name: Apply Android build patches (Expo SDK 52 compat)
        run: node scripts/patch-android.js

      # 测试构建注入第四位（A.B.C-<run_number>）；tag 正式构建不改版本字符串，
      # 但同样要用 run_number 填 versionCode——否则正式包会被测试包（versionCode 已被抬高）挡装
      - name: Inject build number
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            node scripts/ci-version.js "${{ github.run_number }}" --official
          else
            node scripts/ci-version.js "${{ github.run_number }}"
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build Release APK (self-contained JS bundle)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1g"

      - name: Read version
        id: version
        run: echo "ver=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: slywrite-lite-v${{ steps.version.outputs.ver }}-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release (official builds only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="changelog/CHANGELOG-${TAG#v}.md"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" android/app/build/outputs/apk/release/app-release.apk --clobber
          else
            gh release create "${TAG}" \
              android/app/build/outputs/apk/release/app-release.apk \
              --title "SlyWrite Lite ${TAG}" \
              --notes "SlyWrite Lite 发布。更新说明见 ${NOTES}"
          fi
