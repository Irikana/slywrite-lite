name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    # 创建 GitHub Release 需要 contents: write（仓库默认只读时会失败）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build Release APK (self-contained JS bundle)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: slywrite-lite-v0.1.0-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Read version
        id: version
        run: echo "ver=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (skip if tag exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/${{ steps.version.outputs.ver }}" >/dev/null 2>&1; then
            echo "tag ${{ steps.version.outputs.ver }} 已存在，跳过 Release 创建"
          else
            gh release create "${{ steps.version.outputs.ver }}" \
              android/app/build/outputs/apk/release/app-release.apk \
              --title "SlyWrite Lite ${{ steps.version.outputs.ver }}" \
              --notes "SlyWrite Lite 发布。更新说明见 changelog/CHANGELOG-${{ steps.version.outputs.ver }}.md"
          fi
