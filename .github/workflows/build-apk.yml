name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    # 创建 GitHub Release 需要 contents: write（仓库默认只读时会失败）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # package.json 里的 postinstall 已会执行；此处显式再跑一次，
      # 让补丁输出在构建日志里单独可见，便于排查 assembleRelease 失败。
      - name: Apply Android build patches (Expo SDK 52 compat)
        run: node scripts/patch-android.js

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build Release APK (self-contained JS bundle)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: slywrite-lite-v0.0.1-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Read version
        id: version
        run: echo "ver=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (skip if tag exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.ver }}"
          # changelog 文件名不带 v 前缀（CHANGELOG-0.0.1.md），从 tag 里剥掉
          NOTES="changelog/CHANGELOG-${TAG#v}.md"
          if gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} 已存在，跳过 Release 创建"
          else
            gh release create "${TAG}" \
              android/app/build/outputs/apk/release/app-release.apk \
              --title "SlyWrite Lite ${TAG}" \
              --notes "SlyWrite Lite 发布。更新说明见 ${NOTES}"
          fi
