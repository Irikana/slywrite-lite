name: Build PC

# 与 Build APK 完全独立：不同触发产物、不同打包工具，仅共用 package.json 的版本号。
# 版本规则（见 AGENTS.md）：push main / 手动触发 = 测试构建（A.B.C.<run_number>，只出 artifact）；
# 推送 vA.B.C 标签 = 正式发布（产物挂到该 Release）。不建 tag。

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Windows runner 默认未开长路径支持：electron-builder 扫 node_modules 即秒退（error before start）。
      - name: Enable Win32 long paths
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1 -Type DWord
          "LongPathsEnabled now: $((Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled').LongPathsEnabled)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject build number (test builds only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: node scripts/ci-version.js "${{ github.run_number }}"

      - name: Export web bundle (with hydration strip)
        run: npm run build:web

      - name: Build portable EXE (electron-builder)
        # CSC_IDENTITY_AUTO_DISCOVERY=false：无证书环境跳过签名尝试（否则 builder 会去找
        # winCodeSign / 证书，报错信息还可能被签名失败掩盖真实问题）
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win portable --x64 --publish never *>&1 | Tee-Object -FilePath eb.log; exit $LASTEXITCODE

      # 失败诊断：actions 日志匿名拉不到（403），error annotation 是公开可读的——
      # 把 electron-builder 输出尾部（含真实报错）写进 annotation，跑失败时无需登录即可取。
      - name: Surface build log on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path eb.log) {
            $tail = (Get-Content eb.log -Tail 60) -join '%0A'
            $tail = $tail -replace "`r", ''
            Write-Output ('::error::electron-builder tail -> ' + $tail)
          } else {
            Write-Output '::error::electron-builder produced no log file'
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pc-build-log-${{ github.run_number }}
          path: eb.log
          retention-days: 7

      - name: Read version
        id: version
        shell: bash
        run: echo "ver=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: slywrite-lite-${{ steps.version.outputs.ver }}-pc
          path: desktop-build/*.exe
          retention-days: 30

      - name: Attach EXE to GitHub Release (official builds only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXE=$(ls desktop-build/*.exe | head -n 1)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${EXE}" --clobber
            echo "已附加 ${EXE} 到 ${TAG}"
          else
            echo "Release ${TAG} 尚不存在，本次仅保留工作流产物"
          fi
