name: Build PC

# 与 Build APK 完全独立：不同触发产物、不同打包工具，仅共用 package.json 的版本号。
# 版本规则（见 AGENTS.md）：push main / 手动触发 = 测试构建（A.B.C.<run_number>，只出 artifact）；
# 推送 vA.B.C 标签 = 正式发布（产物挂到该 Release）。不建 tag。

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject build number (test builds only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: node scripts/ci-version.js "${{ github.run_number }}"

      - name: Export web bundle (with hydration strip)
        run: npm run build:web

      - name: Build portable EXE (electron-builder)
        run: npx electron-builder --win portable
        env:
          ELECTRON-builder_parallel: 'false'

      - name: Read version
        id: version
        shell: bash
        run: echo "ver=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: slywrite-lite-${{ steps.version.outputs.ver }}-pc
          path: desktop-build/*.exe
          retention-days: 30

      - name: Attach EXE to GitHub Release (official builds only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXE=$(ls desktop-build/*.exe | head -n 1)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${EXE}" --clobber
            echo "已附加 ${EXE} 到 ${TAG}"
          else
            echo "Release ${TAG} 尚不存在，本次仅保留工作流产物"
          fi
